[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exam-BentoML-STOJCHESKI"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "bentoml==1.4.35",
    "ipykernel==7.2.0",
    "jwt==1.4.0",
    "pandas==3.0.0",
    "passlib[bcrypt]==1.7.4",
    "pydantic==2.12.5",
    "pyjwt==2.11.0",
    "scikit-learn==1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "requests==2.32.5",
    "ruff==0.15.1",
]
